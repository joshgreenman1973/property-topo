<style>
  :root{--paper:#f5f0e3;--ink:#26211a;--gold:#a8861d;--terra:#b34a2e;--rule:#d8cfb8}
  html,body{height:100%}
  body{margin:0;background:var(--ink);font-family:'Newsreader',Georgia,serif;color:var(--paper)}
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%, #332c22, #1c1712 70%)}
  .cover{width:min(430px,94vw);background:var(--paper);color:var(--ink);padding:44px 40px 36px;
    box-shadow:0 30px 80px #000a, 0 0 0 1px #0006;position:relative}
  .cover:before{content:'';position:absolute;inset:10px;border:1px solid var(--rule);pointer-events:none}
  .cover:after{content:'';position:absolute;inset:14px;border:1px solid var(--rule);pointer-events:none}
  .ck{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--terra);text-align:center}
  .cover h1{font-family:'Fraunces',serif;font-weight:640;font-size:31px;line-height:1.06;text-align:center;margin:14px 0 4px;letter-spacing:-.01em}
  .cover .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a7f6a;text-align:center;margin-bottom:26px}
  .plot{display:block;margin:0 auto 24px}
  .plot path{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease forwards .3s}
  .plot .hs{fill:var(--terra);opacity:0;animation:pop .5s ease forwards 2.2s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}
  form{display:flex;gap:8px;position:relative;z-index:2}
  input[type=password]{flex:1;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.12em;
    padding:11px 13px;border:1.5px solid var(--ink);background:#fffdf6;color:var(--ink);border-radius:0;outline:none;min-width:0}
  input[type=password]:focus{border-color:var(--terra)}
  button{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);border:0;padding:0 20px;cursor:pointer}
  button:hover{background:var(--terra)}
  #msg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--terra);text-align:center;min-height:16px;margin-top:12px}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .lock{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8a7f6a;text-align:center;margin-top:20px}
</style>

const ITER = 400000;

async function tryOpen(pw){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = 'unlocking…';
  try{
    const html = await tryOpen(document.getElementById('pw').value);
    document.body.style.background = '#f5f0e3';
    document.getElementById('gate').remove();
    const host = document.createElement('div');
    host.innerHTML = html;
    document.body.appendChild(host);
    initMap();
    document.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', ev => {
      ev.preventDefault();
      const t = document.querySelector(a.getAttribute('href'));
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    }));
  }catch(err){
    msg.textContent = 'wrong key';
    const c = document.getElementById('cover');
    c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  }
});

function initMap(){
  const D = JSON.parse(document.getElementById('geodata').textContent);
  const S = 900, half = D.half;
  const px = v => (v + half) * S / (2*half);
  const ptstr = ring => ring.map(p => px(p[0]).toFixed(1)+','+px(p[1]).toFixed(1)).join(' ');
  const svg = document.getElementById('svgmap');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, at, parent) => { const n = document.createElementNS(NS,t);
    for(const k in at) n.setAttribute(k, at[k]); (parent||svg).appendChild(n); return n; };

  // defs: hatch patterns
  const defs = el('defs', {});
  const mkHatch = (id, color) => {
    const p = el('pattern', {id, width:7, height:7, patternUnits:'userSpaceOnUse', patternTransform:'rotate(45)'}, defs);
    el('rect', {width:7, height:7, fill:color, opacity:.16}, p);
    el('line', {x1:0, y1:0, x2:0, y2:7, stroke:color, 'stroke-width':1.4, opacity:.5}, p);
  };
  mkHatch('hwet', '#3f6e93');
  mkHatch('hhab', '#6b6b3a');

  // base images
  const imgT = el('image', {href:D.terrain_b64, x:0, y:0, width:S, height:S, preserveAspectRatio:'none'});
  const imgA = el('image', {href:D.aerial_b64, x:0, y:0, width:S, height:S, preserveAspectRatio:'none', visibility:'hidden'});
  document.getElementById('b-terrain').onclick = e => { imgT.setAttribute('visibility','visible'); imgA.setAttribute('visibility','hidden');
    document.getElementById('b-terrain').classList.add('on'); document.getElementById('b-aerial').classList.remove('on'); };
  document.getElementById('b-aerial').onclick = e => { imgA.setAttribute('visibility','visible'); imgT.setAttribute('visibility','hidden');
    document.getElementById('b-aerial').classList.add('on'); document.getElementById('b-terrain').classList.remove('on'); };

  const layers = {};
  const L = name => layers[name] || (layers[name] = el('g', {'data-layer':name}));
  const tipOf = n => n.closest('[data-tip]');

  // special ways band
  for(const r of D.specialways) el('polygon', {points:ptstr(r), fill:'#a8861d', opacity:.13, 'data-tip':'Special Ways Zone: 200 ft either side of Old South Road centerline. 12-ft road width cap, no paving, curbcuts >=1,000 ft apart without a special permit, 18-ft height cap for structures inside the band (zoning sec. 3.8, 14.1).'}, L('sw'));

  // neighbors
  for(const n of D.neighbors){
    for(const r of n.rings){
      el('polygon', {points:ptstr(r), fill:'transparent', stroke:'#8a7f6a', 'stroke-width':1, 'stroke-dasharray':'3 4',
        'data-tip':(n.owner||'abutter') + (n.acres ? ' — '+n.acres+' ac' : '')}, L('nb'));
    }
  }

  // wet soils
  for(const w of D.wet){
    for(const r of w.rings){
      el('polygon', {points:ptstr(r), fill:'url(#hwet)', stroke:'#3f6e93', 'stroke-width':1.2,
        'data-tip': w.name + ' — ' + w.drainage + ', hydric. SSURGO mapping (1:24k); field delineation would supersede.'}, L('wet'));
    }
  }

  // NHESP
  for(const r of D.nhesp){
    el('polygon', {points:ptstr(r), fill:'url(#hhab)', stroke:'#6b6b3a', 'stroke-width':1.2,
      'data-tip':'NHESP Priority Habitat PH 35 (approximate extent, ~1 ac). Work inside requires a MESA filing. The candidate lot avoids it entirely.'}, L('hab'));
  }

  // 2.5 variant
  for(const r of D.lot25){
    el('polygon', {points:ptstr(r), fill:'transparent', stroke:'#b34a2e', 'stroke-width':1.4, 'stroke-dasharray':'2 5',
      'data-tip':'2.5-acre variant: line ~260 ft west of the house. ~313 ft frontage, ~1.6 ac dry.'}, L('lot25'));
  }

  // candidate lot
  for(const r of D.lot){
    el('polygon', {points:ptstr(r), fill:'#b34a2e', opacity:.14, stroke:'none'}, L('lot'));
    el('polygon', {points:ptstr(r), fill:'transparent', stroke:'#b34a2e', 'stroke-width':2.4, 'stroke-dasharray':'8 5',
      'data-tip':'Candidate lot: 2.00 ac, ~264 ft frontage on Old South Road, ~1.2 ac dry, ~495 ft from the existing house.'}, L('lot'));
  }

  // parcel
  for(const r of D.parcel){
    el('polygon', {points:ptstr(r), fill:'transparent', stroke:'#a8861d', 'stroke-width':3,
      'data-tip':'32 Old South Road: 9.58 ac (assessor), Greenman Richard L Trust. Boundary: MassGIS L3 parcels.'}, L('parcel'));
  }

  // roads
  for(const rd of D.roads){
    el('polyline', {points:ptstr(rd.pts), fill:'none', stroke:'#4a4238', 'stroke-width':4, 'stroke-linecap':'round', opacity:.75,
      'data-tip': rd.name + (rd.name==='Old South Road' ? ' — protected Special Way: unpaved, capped at 12 ft wide.' : ' — residential lane serving the northern abutters.')}, L('rd'));
  }
  const lbl = (x,z,t,rot) => { const e = el('text', {x:px(x), y:px(z), fill:'#372f26', 'font-size':15,
    'font-family':"'IBM Plex Mono',monospace", 'letter-spacing':'.08em',
    transform: rot ? 'rotate('+rot+' '+px(x)+' '+px(z)+')' : ''}, L('rd')); e.textContent = t; };
  lbl(-95, 152, 'OLD SOUTH ROAD', -4);
  lbl(-10, -175, 'BRIAR PATH', -8);

  // house + drive + homesite
  el('polyline', {points:ptstr(D.drive), fill:'none', stroke:'#3d3833', 'stroke-width':2, 'stroke-dasharray':'5 4', opacity:.7,
    'data-tip':'Existing driveway corridor (approximate) — enters from Old South Road at the parcel’s south point; untouched by the carve.'}, L('house'));
  el('polygon', {points:ptstr(D.house), fill:'#26211a', stroke:'#000',
    'data-tip':'Existing house: 1990, 2.5 stories, 2,024 sq ft living, on the parcel’s high knoll (~118 ft).'}, L('house'));
  const hx = px(D.homesite[0]), hz = px(D.homesite[1]);
  const star = el('g', {'data-tip':'Suggested homesite: dry Nantucket-Plymouth soil, ~6.5° slope, ~110 ft off the road, ~495 ft from the existing house. Analytical suggestion only — perc tests decide.'}, L('site'));
  el('circle', {cx:hx, cy:hz, r:13, fill:'#b34a2e', opacity:.25}, star);
  el('circle', {cx:hx, cy:hz, r:6.5, fill:'#b34a2e', stroke:'#6e2717', 'stroke-width':1.5}, star);

  // separation line
  const hc = D.house.reduce((a,p)=>[a[0]+p[0]/D.house.length, a[1]+p[1]/D.house.length],[0,0]);
  el('line', {x1:hx, y1:hz, x2:px(hc[0]), y2:px(hc[1]), stroke:'#26211a', 'stroke-width':1.2, 'stroke-dasharray':'2 5', opacity:.55,
    'data-tip':'~495 ft of continuous woods between the suggested homesite and the existing house (80% tree cover, median canopy ~38 ft).'}, L('site'));

  // scale bar: 100 m
  const g = el('g', {});
  const y0 = S-34, x0 = 34, len = 100 * S/(2*half);
  el('line', {x1:x0, y1:y0, x2:x0+len, y2:y0, stroke:'#26211a', 'stroke-width':2.5}, g);
  el('line', {x1:x0, y1:y0-6, x2:x0, y2:y0+6, stroke:'#26211a', 'stroke-width':2.5}, g);
  el('line', {x1:x0+len, y1:y0-6, x2:x0+len, y2:y0+6, stroke:'#26211a', 'stroke-width':2.5}, g);
  const st = el('text', {x:x0+len/2, y:y0+22, 'text-anchor':'middle', fill:'#26211a', 'font-size':14, 'font-family':"'IBM Plex Mono',monospace"}, g);
  st.textContent = '100 m / 328 ft';
  const na = el('text', {x:S-38, y:52, 'text-anchor':'middle', fill:'#26211a', 'font-size':20, 'font-weight':'bold', 'font-family':"'Fraunces',serif"}, svg);
  na.textContent = 'N';
  el('line', {x1:S-38, y1:62, x2:S-38, y2:96, stroke:'#26211a', 'stroke-width':2.2, 'marker-end':''});

  // layer control
  const defs2 = [
    ['parcel','Parcel boundary','#a8861d',true],
    ['lot','Candidate lot (2.0 ac)','#b34a2e',true],
    ['lot25','2.5-ac variant','#b34a2e',false],
    ['wet','Wet (hydric) soils','#3f6e93',true],
    ['hab','Priority Habitat (approx.)','#6b6b3a',false],
    ['sw','Special Ways 200-ft band','#a8861d',false],
    ['site','Homesite + separation','#b34a2e',true],
    ['house','Existing house + drive','#26211a',true],
    ['nb','Abutting parcels','#8a7f6a',false],
    ['rd','Roads','#4a4238',true],
  ];
  const box = document.getElementById('lyrs');
  for(const [id, name, color, on] of defs2){
    if(!layers[id]) continue;
    layers[id].setAttribute('visibility', on ? 'visible' : 'hidden');
    const lab = document.createElement('label');
    lab.innerHTML = '<input type="checkbox" '+(on?'checked':'')+'> <span class="sw" style="background:'+color+'"></span> '+name;
    lab.querySelector('input').addEventListener('change', e => {
      layers[id].setAttribute('visibility', e.target.checked ? 'visible' : 'hidden');
    });
    box.appendChild(lab);
  }

  // tooltip
  const tip = document.getElementById('tip');
  const holder = svg.parentElement;
  svg.addEventListener('pointermove', e => {
    const t = tipOf(e.target);
    if(t){
      tip.style.display = 'block';
      tip.textContent = t.getAttribute('data-tip');
      const r = holder.getBoundingClientRect();
      let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
      if(x > r.width - 260) x = e.clientX - r.left - 254;
      if(y > r.height - 90) y = e.clientY - r.top - 80;
      tip.style.left = x+'px'; tip.style.top = y+'px';
    } else tip.style.display = 'none';
  });
  svg.addEventListener('pointerleave', () => tip.style.display = 'none');
}
</script>
</body>
</html>
